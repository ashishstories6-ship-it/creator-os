<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Creator OS">
<meta name="theme-color" content="#0A0A0A">
<link rel="manifest" href="manifest.json">
<title>Creator OS</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;500;600;700;800&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #0A0A0A;
  --bg2: #111111;
  --bg3: #1A1A1A;
  --border: rgba(255,255,255,0.07);
  --border2: rgba(255,255,255,0.12);
  --text: #F0EDE8;
  --text2: #8A8680;
  --text3: #5A5752;
  --accent: #E8D5B0;
  --green: #4ADE80;
  --orange: #FB923C;
  --red: #F87171;
  --blue: #60A5FA;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden;background:var(--bg);color:var(--text);font-family:'Syne',sans-serif}

/* SPLASH */
#splash{position:fixed;inset:0;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:1000;transition:opacity 0.5s}
#splash.hide{opacity:0;pointer-events:none}
.splash-logo{font-size:11px;letter-spacing:0.2em;color:var(--text3);text-transform:uppercase;margin-bottom:24px}
.splash-title{font-size:36px;font-weight:800;color:var(--text);letter-spacing:-0.02em;margin-bottom:8px}
.splash-sub{font-size:13px;color:var(--text3);letter-spacing:0.04em}
.splash-dot{width:4px;height:4px;border-radius:50%;background:var(--accent);animation:blink 1.2s infinite;margin-top:40px}
@keyframes blink{0%,100%{opacity:0.3}50%{opacity:1}}

/* SETUP */
#setup-screen{position:fixed;inset:0;background:var(--bg);display:flex;flex-direction:column;padding:env(safe-area-inset-top,24px) 24px 24px;z-index:900}
#setup-screen.hide{display:none}
.setup-header{margin-top:48px;margin-bottom:40px}
.setup-eyebrow{font-size:11px;letter-spacing:0.16em;color:var(--text3);text-transform:uppercase;margin-bottom:12px}
.setup-title{font-size:28px;font-weight:700;color:var(--text);line-height:1.2;letter-spacing:-0.01em}
.setup-title span{color:var(--accent)}
.field{margin-bottom:16px}
.field label{display:block;font-size:11px;letter-spacing:0.1em;color:var(--text3);text-transform:uppercase;margin-bottom:8px}
.field input{width:100%;background:var(--bg3);border:1px solid var(--border2);border-radius:10px;padding:14px 16px;font-size:14px;font-family:'DM Mono',monospace;color:var(--text);outline:none;transition:border-color 0.2s}
.field input:focus{border-color:var(--accent)}
.field input::placeholder{color:var(--text3)}
.connect-btn{width:100%;background:var(--accent);color:#0A0A0A;border:none;border-radius:10px;padding:16px;font-size:15px;font-weight:700;font-family:'Syne',sans-serif;letter-spacing:0.02em;cursor:pointer;margin-top:8px;transition:opacity 0.2s}
.connect-btn:active{opacity:0.8}
.setup-err{font-size:12px;color:var(--red);margin-top:12px;text-align:center}
.setup-note{font-size:12px;color:var(--text3);line-height:1.6;margin-top:24px;text-align:center}
.setup-note a{color:var(--accent);text-decoration:none}

/* MAIN APP */
#app{position:fixed;inset:0;display:flex;flex-direction:column;display:none}
#app.show{display:flex}

/* HEADER */
.app-header{padding:env(safe-area-inset-top,16px) 20px 0;background:var(--bg)}
.header-top{display:flex;align-items:center;justify-content:space-between;padding-top:16px;margin-bottom:16px}
.app-logo{font-size:10px;letter-spacing:0.16em;color:var(--text3);text-transform:uppercase}
.live-badge{display:flex;align-items:center;gap:5px;font-size:11px;color:var(--green);font-family:'DM Mono',monospace}
.live-dot{width:5px;height:5px;border-radius:50%;background:var(--green);animation:blink 2s infinite}

/* STATS ROW */
.stats-row{display:flex;gap:8px;margin-bottom:16px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.stats-row::-webkit-scrollbar{display:none}
.stat-pill{background:var(--bg3);border:1px solid var(--border);border-radius:8px;padding:10px 14px;white-space:nowrap;flex-shrink:0}
.stat-pill-label{font-size:10px;color:var(--text3);text-transform:uppercase;letter-spacing:0.08em;margin-bottom:3px}
.stat-pill-val{font-size:20px;font-weight:700;font-family:'DM Mono',monospace;color:var(--text)}

/* NICHE SCROLLER */
.niche-scroll{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px;margin-bottom:4px;scrollbar-width:none}
.niche-scroll::-webkit-scrollbar{display:none}
.niche-chip{background:var(--bg3);border:1px solid var(--border);border-radius:20px;padding:6px 14px;font-size:12px;font-weight:500;color:var(--text2);white-space:nowrap;cursor:pointer;transition:all 0.15s;flex-shrink:0}
.niche-chip.active{background:var(--accent);border-color:var(--accent);color:#0A0A0A}

/* TABS */
.tab-row{display:flex;border-bottom:1px solid var(--border);margin-bottom:0}
.tab-btn{flex:1;padding:10px 4px;font-size:11px;font-weight:600;letter-spacing:0.06em;text-transform:uppercase;color:var(--text3);border:none;background:transparent;font-family:'Syne',sans-serif;cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px;transition:all 0.15s}
.tab-btn.active{color:var(--accent);border-bottom-color:var(--accent)}

/* CONTENT */
.content-area{flex:1;overflow-y:auto;padding:12px 20px env(safe-area-inset-bottom,20px);scrollbar-width:none}
.content-area::-webkit-scrollbar{display:none}
.panel{display:none;flex-direction:column;gap:8px}
.panel.active{display:flex}

/* CARDS */
.hook-card{background:var(--bg2);border:1px solid var(--border);border-radius:12px;padding:14px 16px;display:flex;align-items:flex-start;gap:12px}
.hook-text{font-size:14px;color:var(--text);flex:1;line-height:1.5;font-weight:500}
.score{font-family:'DM Mono',monospace;font-size:12px;font-weight:500;padding:4px 8px;border-radius:6px;flex-shrink:0}
.s-high{background:rgba(74,222,128,0.12);color:var(--green)}
.s-med{background:rgba(251,146,60,0.12);color:var(--orange)}
.s-low{background:rgba(255,255,255,0.06);color:var(--text3)}

.trend-card{background:var(--bg2);border:1px solid var(--border);border-radius:12px;padding:14px 16px}
.trend-hook{font-size:14px;font-weight:600;color:var(--text);line-height:1.4;margin-bottom:10px}
.trend-footer{display:flex;align-items:center;justify-content:space-between}
.trend-meta{display:flex;gap:12px}
.meta-item{font-size:11px;font-family:'DM Mono',monospace;color:var(--text3)}
.meta-item span{color:var(--text2)}
.view-btn{font-size:11px;font-weight:600;color:var(--accent);text-decoration:none;letter-spacing:0.04em;font-family:'Syne',sans-serif}
.platform-tag{font-size:10px;font-weight:600;letter-spacing:0.08em;padding:3px 8px;border-radius:4px;text-transform:uppercase}
.pt-instagram{background:rgba(232,213,176,0.1);color:var(--accent)}
.pt-youtube{background:rgba(248,113,113,0.1);color:var(--red)}

.idea-card{background:var(--bg2);border:1px solid var(--border);border-radius:12px;padding:14px 16px}
.idea-niche{font-size:10px;letter-spacing:0.1em;color:var(--text3);text-transform:uppercase;margin-bottom:6px}
.idea-text{font-size:13px;color:var(--text2);line-height:1.7;display:-webkit-box;-webkit-line-clamp:5;-webkit-box-orient:vertical;overflow:hidden}

.empty{text-align:center;padding:40px 20px;color:var(--text3);font-size:13px;line-height:1.8}
.empty-icon{font-size:32px;margin-bottom:12px}
.loading-text{text-align:center;padding:40px;color:var(--text3);font-size:13px;font-family:'DM Mono',monospace}

/* BOTTOM NAV */
.bottom-nav{background:var(--bg);border-top:1px solid var(--border);padding:8px 0 env(safe-area-inset-bottom,8px);display:flex}
.nav-btn{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;padding:8px 4px;background:transparent;border:none;cursor:pointer;color:var(--text3);transition:color 0.15s}
.nav-btn.active{color:var(--accent)}
.nav-icon{font-size:20px}
.nav-label{font-size:10px;font-weight:600;letter-spacing:0.06em;text-transform:uppercase;font-family:'Syne',sans-serif}
</style>
</head>
<body>

<!-- SPLASH -->
<div id="splash">
  <div class="splash-logo">Ashish · Creator Tools</div>
  <div class="splash-title">Creator OS</div>
  <div class="splash-sub">AI Content Intelligence</div>
  <div class="splash-dot"></div>
</div>

<!-- SETUP -->
<div id="setup-screen">
  <div class="setup-header">
    <div class="setup-eyebrow">Connect your database</div>
    <div class="setup-title">Your AI content<br>studio <span>awaits.</span></div>
  </div>
  <div class="field">
    <label>Supabase URL</label>
    <input type="url" id="sb-url" placeholder="https://xxxx.supabase.co" autocomplete="off" autocapitalize="none">
  </div>
  <div class="field">
    <label>Anon Key</label>
    <input type="password" id="sb-key" placeholder="eyJhbGci..." autocomplete="off">
  </div>
  <button class="connect-btn" onclick="connectDB()">Connect →</button>
  <div class="setup-err" id="setup-err"></div>
  <div class="setup-note">
    Get your credentials from<br>
    <a href="https://supabase.com/dashboard" target="_blank">supabase.com/dashboard</a> → Settings → API
  </div>
</div>

<!-- MAIN APP -->
<div id="app">
  <div class="app-header">
    <div class="header-top">
      <div class="app-logo">Creator OS</div>
      <div class="live-badge"><div class="live-dot"></div>Live</div>
    </div>
    <div class="stats-row">
      <div class="stat-pill">
        <div class="stat-pill-label">Trends</div>
        <div class="stat-pill-val" id="c-trends">—</div>
      </div>
      <div class="stat-pill">
        <div class="stat-pill-label">Hooks</div>
        <div class="stat-pill-val" id="c-hooks">—</div>
      </div>
      <div class="stat-pill">
        <div class="stat-pill-label">Ideas</div>
        <div class="stat-pill-val" id="c-ideas">—</div>
      </div>
    </div>
    <div class="niche-scroll" id="niche-scroll"></div>
    <div class="tab-row">
      <button class="tab-btn active" onclick="switchTab('hooks',this)">Hooks</button>
      <button class="tab-btn" onclick="switchTab('trends',this)">Trends</button>
      <button class="tab-btn" onclick="switchTab('ideas',this)">Ideas</button>
    </div>
  </div>
  <div class="content-area">
    <div class="panel active" id="panel-hooks"></div>
    <div class="panel" id="panel-trends"></div>
    <div class="panel" id="panel-ideas"></div>
  </div>
</div>

<script>
let SB_URL='', SB_KEY='';
let allData={trends:[],hooks:[],scripts:[]};
let activeNiche='all';

const NICHES=[
  {id:'all',label:'✦ All'},
  {id:'cinematic filmmaking',label:'🎬 Cinematic'},
  {id:'personal finance',label:'💰 Finance'},
  {id:'fitness & health',label:'💪 Fitness'},
  {id:'clothing & fashion',label:'👗 Fashion'},
  {id:'tech & ai',label:'🤖 Tech & AI'},
  {id:'food & recipes',label:'🍜 Food'},
  {id:'travel',label:'✈️ Travel'},
  {id:'motivation & mindset',label:'🔥 Motivation'},
  {id:'business & entrepreneurship',label:'📈 Business'}
];

// Show splash then setup
setTimeout(()=>{
  document.getElementById('splash').classList.add('hide');
  // Check saved credentials
  const savedUrl=localStorage.getItem('sb_url');
  const savedKey=localStorage.getItem('sb_key');
  if(savedUrl&&savedKey){
    document.getElementById('sb-url').value=savedUrl;
    document.getElementById('sb-key').value=savedKey;
    SB_URL=savedUrl; SB_KEY=savedKey;
    loadData();
  }
},1800);

async function sbFetch(table,order,limit){
  const r=await fetch(`${SB_URL}/rest/v1/${table}?order=${order}.desc&limit=${limit}`,{
    headers:{'apikey':SB_KEY,'Authorization':'Bearer '+SB_KEY,'Content-Type':'application/json'}
  });
  if(!r.ok) throw new Error(await r.text());
  return r.json();
}

async function connectDB(){
  SB_URL=document.getElementById('sb-url').value.trim().replace(/\/$/,'');
  SB_KEY=document.getElementById('sb-key').value.trim();
  if(!SB_URL||!SB_KEY){document.getElementById('setup-err').textContent='Please fill both fields.';return;}
  document.getElementById('setup-err').textContent='';
  const btn=document.querySelector('.connect-btn');
  btn.textContent='Connecting...';
  try{
    await loadData();
    localStorage.setItem('sb_url',SB_URL);
    localStorage.setItem('sb_key',SB_KEY);
  }catch(e){
    document.getElementById('setup-err').textContent='Connection failed — check your credentials.';
    btn.textContent='Connect →';
  }
}

async function loadData(){
  const [trends,hooks,scripts]=await Promise.all([
    sbFetch('trends','created_at',200),
    sbFetch('hooks','score',200),
    sbFetch('scripts','created_at',200)
  ]);
  allData={trends,hooks,scripts};
  document.getElementById('c-trends').textContent=trends.length;
  document.getElementById('c-hooks').textContent=hooks.length;
  document.getElementById('c-ideas').textContent=scripts.length;
  buildNiches();
  renderAll();
  document.getElementById('setup-screen').classList.add('hide');
  const app=document.getElementById('app');
  app.classList.add('show');
}

function buildNiches(){
  const el=document.getElementById('niche-scroll');
  el.innerHTML=NICHES.map(n=>`
    <div class="niche-chip ${n.id==='all'?'active':''}" onclick="selectNiche('${n.id}',this)">${n.label}</div>
  `).join('');
}

function selectNiche(id,el){
  activeNiche=id;
  document.querySelectorAll('.niche-chip').forEach(c=>c.classList.remove('active'));
  el.classList.add('active');
  renderAll();
}

function filterByNiche(arr){
  if(activeNiche==='all') return arr;
  return arr.filter(i=>i.topic&&i.topic.toLowerCase()===activeNiche.toLowerCase());
}

function scoreClass(s){return s>=8?'s-high':s>=5?'s-med':'s-low'}

function renderAll(){
  renderHooks();
  renderTrends();
  renderIdeas();
}

function renderHooks(){
  const el=document.getElementById('panel-hooks');
  const hooks=filterByNiche(allData.hooks);
  if(!hooks.length){el.innerHTML='<div class="empty"><div class="empty-icon">🎣</div>No hooks for this niche yet.<br>Run your n8n workflow first.</div>';return;}
  el.innerHTML=hooks.map(h=>`
    <div class="hook-card">
      <div class="hook-text">${h.hook||'—'}</div>
      <div class="score ${scoreClass(h.score||0)}">${h.score||0}/10</div>
    </div>`).join('');
}

function renderTrends(){
  const el=document.getElementById('panel-trends');
  const trends=filterByNiche(allData.trends);
  if(!trends.length){el.innerHTML='<div class="empty"><div class="empty-icon">📊</div>No trends for this niche yet.<br>Run your n8n workflow first.</div>';return;}
  el.innerHTML=trends.map(t=>`
    <div class="trend-card">
      <div class="trend-hook">${t.hook||t.title||'—'}</div>
      <div class="trend-footer">
        <div class="trend-meta">
          <div class="meta-item">👁 <span>${(t.views||0).toLocaleString()}</span></div>
          <div class="meta-item">❤️ <span>${(t.likes||0).toLocaleString()}</span></div>
        </div>
        <div style="display:flex;align-items:center;gap:8px">
          <span class="platform-tag pt-${t.platform||'instagram'}">${t.platform||'ig'}</span>
          ${t.url?`<a class="view-btn" href="${t.url}" target="_blank">View →</a>`:''}
        </div>
      </div>
    </div>`).join('');
}

function renderIdeas(){
  const el=document.getElementById('panel-ideas');
  const scripts=filterByNiche(allData.scripts);
  if(!scripts.length){el.innerHTML='<div class="empty"><div class="empty-icon">💡</div>No ideas for this niche yet.<br>Run your n8n workflow first.</div>';return;}
  el.innerHTML=scripts.map(s=>`
    <div class="idea-card">
      <div class="idea-niche">${s.topic||'cinematic filmmaking'}</div>
      <div class="idea-text">${s.script||s.hook||'—'}</div>
    </div>`).join('');
}

function switchTab(name,el){
  document.querySelectorAll('.tab-btn').forEach(t=>t.classList.remove('active'));
  document.querySelectorAll('.panel').forEach(p=>p.classList.remove('active'));
  el.classList.add('active');
  document.getElementById('panel-'+name).classList.add('active');
}

// Register service worker
if('serviceWorker' in navigator){
  navigator.serviceWorker.register('sw.js');
}
</script>
</body>
</html>
